[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-data-quality-agent"
version = "0.1.0"
description = "A local tabular data quality workflow with LangChain tools and LangGraph approval gates."
authors = [{name = "Krishna Kallamadi"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-nebius>=0.1,<1",
  "langchain-fireworks>=1,<2",
  "streamlit>=1.45,<2",
  "python-dotenv>=1,<2",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dq_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
